<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}CS Tutoring{% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'ta_dashboard' %}">
          TA Scheduler
        </a>

        <div class="d-flex gap-2 align-items-center">
          {% if user.is_authenticated %}
          <span class="text-white me-2"> {{ user.username }} </span>

          {% if user.is_superuser or user.ta %}
          <a
            class="btn btn-outline-light btn-sm"
            href="{% url 'edit_availability' %}"
          >
            Edit Availability
          </a>
          {% endif %}

          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="btn btn-outline-light btn-sm" type="submit">
              Sign Out
            </button>
          </form>
          {% else %}
          <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}"
            >Sign In</a
          >
          <a class="btn btn-primary btn-sm" href="{% url 'signup' %}"
            >Sign Up</a
          >
          {% endif %}
        </div>
      </div>
    </nav>

    <main class="container py-4">{% block content %} {% endblock %}</main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

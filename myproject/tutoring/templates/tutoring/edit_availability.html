<!DOCTYPE html>
<html>
<head>
    <title>Management Control Board</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        .grid-container { display: flex; gap: 40px; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 5px; width: 45%; background: #fdfdfd; }
        h3 { color: #007BFF; margin-top: 0; }
        button { background: #007BFF; color: white; border: none; padding: 10px 15px; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .back-link { display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>TA Management Workspace</h2>
    <hr>

    <div class="grid-container">
        {% if is_master %}
        <div class="card">
            <h3>Step 1: Create New TA Profile</h3>
            <form method="post">
                {% csrf_token %}
                {{ ta_form.as_p }}
                <button type="submit" name="create_ta">Publish New TA Profile</button>
            </form>
        </div>
        {% endif %}

        <div class="card" {% if not is_master %}style="width: 100%;"{% endif %}>
            <h3>Step 2: Assign Schedule Window</h3>
            <form method="post">
                {% csrf_token %}
                {{ slot_form.as_p }}
                <button type="submit" name="add_availability">Publish Time Slot</button>
            </form>
        </div>
    </div>

    <a href="{% url 'ta_dashboard' %}" class="back-link">🔙 Cancel and Return to Schedule Board</a>

</body>
</html>

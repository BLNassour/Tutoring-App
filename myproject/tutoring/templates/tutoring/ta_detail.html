{% extends "base.html" %}
{% block title %}{{ ta.name }} - TA Profile{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="fw-bold mb-3">About {{ ta.name }}</h2>

        <div class="mb-4">
          <h5 class="text-primary">Target Grades</h5>
          <p>{{ ta.grades }}</p>
        </div>

        <div class="mb-4">
          <h5 class="text-primary">Biography</h5>
          <p>{{ ta.bio|default:"No bio yet." }}</p>
        </div>

        <hr />

        <a href="{% url 'ta_dashboard' %}" class="btn btn-outline-secondary">
          ← Back to Dashboard
        </a>
      </div>
    </div>
  </div>
</div>

{% endblock %}

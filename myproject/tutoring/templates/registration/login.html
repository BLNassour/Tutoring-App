{% extends "base.html" %} {% load crispy_forms_tags %} {% block title %}TA Sign
In{% endblock %} {% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="mb-3">TA Sign In</h2>

        <form method="post" action="{% url 'login' %}">
          {% csrf_token %} {{ form|crispy }}

          <input type="hidden" name="next" value="{% url 'ta_dashboard' %}" />

          <button class="btn btn-primary w-100" type="submit">Sign In</button>
        </form>

        <a class="d-block mt-3" href="{% url 'ta_dashboard' %}">
          Back to Dashboard
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

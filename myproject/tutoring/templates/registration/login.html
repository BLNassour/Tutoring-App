<!DOCTYPE html>
<html>
<head>
    <title>TA Sign In</title>
</head>
<body>
    <h2>Tutoring Portal Sign In</h2>
    
    {% if form.errors %}
        <p style="color: red;">Your username and password did not match. Please try again.</p>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <p>
            <label for="id_username">Username:</label>
            {{ form.username }}
        </p>
        <p>
            <label for="id_password">Password:</label>
            {{ form.password }}
        </p>
        <button type="submit">Sign In</button>
        <input type="hidden" name="next" value="{% url 'ta_dashboard' %}">
    </form>
    
    <hr>
    <a href="{% url 'ta_dashboard' %}">Return to Dashboard</a>
</body>
</html>
